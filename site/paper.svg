<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <title>Paper texture</title>
  <!-- White paper: a fine tooth of grey speckle plus long, faint fibres. Tiles seamlessly. -->
  <filter id="tooth" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="4" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.38  0 0 0 0 0.37  0 0 0 0 0.45  0 0 0 0.13 -0.04"/>
  </filter>
  <filter id="fibre" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035 0.09" numOctaves="3" seed="9" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.40  0 0 0 0 0.48  0 0 0 0.10 -0.045"/>
  </filter>
  <rect width="320" height="320" filter="url(#tooth)"/>
  <rect width="320" height="320" filter="url(#fibre)"/>
</svg>
