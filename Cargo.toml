[workspace]
resolver = "2"
members = [
    "core/ipc",
    "core/orchestrator",
    "core/asr",
    "core/cleanup",
    "core/models",
    "core/ffi",
    "tools/headless",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.release]
lto = "thin"
