[package]
name = "cadence-ffi"
version.workspace = true
edition.workspace = true

[lib]
name = "cadence_ffi"
# staticlib for the native shells; rlib so the FFI surface stays testable from Rust.
# No cdylib: with both in target/release the Swift linker preferred the dylib and bound
# Cadence.app to an ABSOLUTE dev-tree path — any cargo build silently swapped the
# installed app's core (bit us live 7/19: a featureless rebuild broke dictation).
crate-type = ["staticlib", "rlib"]

[features]
default = []
whisper = ["cadence-asr/whisper"]

[dependencies]
cadence-ipc = { path = "../ipc" }
cadence-asr = { path = "../asr" }
cadence-cleanup = { path = "../cleanup" }
cadence-orchestrator = { path = "../orchestrator" }
serde_json = { workspace = true }
cadence-models = { path = "../models" }
cadence-store = { path = "../store" }
