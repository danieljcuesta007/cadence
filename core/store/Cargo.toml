[package]
name = "cadence-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# SQLCipher compiled from source with a vendored OpenSSL: no system deps, no admin,
# works offline once the registry cache is warm (§24 encrypted store, blueprint §"local
# data at rest": SQLCipher-class DB encryption, key held in the OS keychain).
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
cadence-models = { path = "../models" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
